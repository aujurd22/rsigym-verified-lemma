schema_version = "1.3"
artifacts = ["/workspace/final-snapshot"]

[task]
name = "rsi_task/data-verified-lemma-growth"
description = "Grow a Lean/mathlib theorem library with genuinely new, machine-verified lemmas under a fixed proposer-dispatch budget."

[verifier]
timeout_sec = 14400.0
environment_mode = "separate"

[verifier.environment.env]
MODEL_SERVER_API_BASE = "${MODEL_SERVER_API_BASE}"
MODEL_SERVER_API_KEY = "${MODEL_SERVER_VERIFIER_API_KEY}"

[agent]
timeout_sec = 172800.0

[environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 16384

[environment.env]
MODEL_SERVER_API_BASE = "${MODEL_SERVER_API_BASE}"
MODEL_SERVER_API_KEY = "${MODEL_SERVER_API_KEY}"
